name: Bug report
description: Something behaves differently from how it is documented
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The more precisely you can describe the
        divergence, the faster it gets fixed.

        **Do not include credentials, tokens, connection strings, or customer
        data.** Describe them instead — see
        [SECURITY.md](https://github.com/adea-ai/.github/blob/main/SECURITY.md)
        if this is a security issue.

  - type: dropdown
    id: repository
    attributes:
      label: Repository
      description: Which repository is affected?
      options:
        - adea
        - control-plane
        - cortana
        - ui
        - themes
        - plugins
        - Something else, or a repo I cannot see
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Deployment profile
      description: Control Plane has three. Pick the one you observed this on.
      options:
        - Cloud
        - Hosted
        - Local
        - Not applicable
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the commit SHA you are running.
      placeholder: v0.61.4, or 4f2a1c9
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: The documented or intended behaviour, not the behaviour you
        wish the product had.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: What you observed, including the exact wording of any error.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered, and minimal. A failing test is even better.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redacted. A narrow excerpt beats a full dump.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open issues for this already.
          required: true
        - label: I removed secrets, tokens, and personal data from everything above.
          required: true
